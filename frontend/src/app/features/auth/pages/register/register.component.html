<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    <div class="mb-4">
      <a routerLink="/tasks" class="inline-flex items-center text-sm font-medium text-gray-500 hover:text-gray-700 transition">
        <svg class="mr-2 w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Voltar para Tarefas
      </a>
    </div>

    <div>
      <h2 class="mt-2 text-center text-3xl font-extrabold text-slate-800">
        Crie uma nova conta
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Já possui uma conta?
        <a routerLink="/auth/login" class="font-medium text-blue-600 hover:text-blue-500">
          Entrar
        </a>
      </p>
    </div>
    
    @if (errorMessage) {
      <div class="bg-red-50 border-l-4 border-red-500 p-4">
        <p class="text-sm text-red-700">{{ errorMessage }}</p>
      </div>
    }

    <form class="mt-8 space-y-6" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="rounded-md shadow-sm space-y-4">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700">Nome</label>
          <input id="name" type="text" formControlName="name"
                 class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm mt-1" 
                 placeholder="Avaliador Essentia">
        </div>
        <div>
          <label for="email-address" class="block text-sm font-medium text-gray-700">Endereço de email</label>
          <input id="email-address" type="email" formControlName="email"
                 class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm mt-1" 
                 placeholder="admin@essentia.com">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
          <input id="password" type="password" formControlName="password"
                 class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm mt-1" 
                 placeholder="••••••••">
        </div>
      </div>

      <div>
        <button type="submit" [disabled]="registerForm.invalid"
                class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          Cadastrar
        </button>
      </div>
    </form>
  </div>
</div>
