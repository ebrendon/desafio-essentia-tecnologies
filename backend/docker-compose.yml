services:
    db:
        image: mysql:8.0
        container_name: techx-db
        restart: always
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-techx_db}
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
            - '${DB_PORT_EXTERNAL:-3307}:3306'
        volumes:
            - db_data:/var/lib/mysql

volumes:
    db_data:
